services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jokko-backend-dev
    init: true
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://jokko:jokko@postgres:5432/jokko
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: jokkoredis
    ports:
      - '${APP_PORT:-3000}:3000'
      - '9229:9229'
    volumes:
      - ./src:/app/src:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3000/api/v1/sante').then((response) => { if (!response.ok) process.exit(1); process.exit(0); }).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: jokko-postgres-dev
    init: true
    environment:
      POSTGRES_USER: jokko
      POSTGRES_PASSWORD: jokko
      POSTGRES_DB: jokko
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jokko -d jokko']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: jokko-redis-dev
    init: true
    command: redis-server --appendonly yes --requirepass jokkoredis
    volumes:
      - redis-data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'jokkoredis', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  default:
    name: jokko-network-dev

volumes:
  postgres-data:
  redis-data: