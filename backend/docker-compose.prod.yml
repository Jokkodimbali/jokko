services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jokko-backend
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - backend-logs:/app/logs
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3000/api/v1/sante').then((response) => { if (!response.ok) process.exit(1); process.exit(0); }).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - jokko-network

  postgres:
    image: postgres:16-alpine
    container_name: jokko-postgres
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jokko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jokko}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-jokko} -d ${POSTGRES_DB:-jokko}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - jokko-network

  redis:
    image: redis:7-alpine
    container_name: jokko-redis
    init: true
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --loglevel ${REDIS_LOG_LEVEL:-notice}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - jokko-network

networks:
  jokko-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  backend-logs: