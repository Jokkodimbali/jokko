services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jokko-backend
    init: true
    env_file:
      - .env
    environment:
      PORT: 3000
    ports:
      - '${APP_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3000/api/v1/sante').then((response) => { if (!response.ok) process.exit(1); process.exit(0); }).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
