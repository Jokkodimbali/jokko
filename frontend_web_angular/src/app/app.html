<div
  *ngIf="feedbackMessage() as message"
  class="app-feedback"
  [class.app-feedback--success]="message.type === 'success'"
  [class.app-feedback--error]="message.type === 'error'"
  [class.app-feedback--info]="message.type === 'info'"
  role="status"
  aria-live="polite"
>
  <span class="app-feedback__icon" aria-hidden="true">
    <lucide-icon name="bell" size="20" [strokeWidth]="2.5"></lucide-icon>
  </span>
  <strong class="app-feedback__copy">{{ message.text }}</strong>
</div>

@if (showNavbar()) {
  @defer (on immediate) {
    <app-navbar
      [mobileLocationLabel]="navbarPresentation.mobileLocationLabel()"
      [mobileLocationStatic]="navbarMobileLocationStatic()"
      [mobilePageTitle]="navbarMobilePageTitle()"
      [mobilePageSubtitle]="navbarMobilePageSubtitle()"
    />
  }
}
<router-outlet></router-outlet>
<app-call-overlay />

<app-delivery-offer-card />

<button
  *ngIf="showSupportButton()"
  type="button"
  class="app-support-button"
  [disabled]="isOpeningSupport()"
  (click)="openSupportConversation()"
  aria-label="Écrire au service client"
>
  <lucide-icon name="message-circle" size="22" [strokeWidth]="2.5"></lucide-icon>
  <span>{{ isOpeningSupport() ? 'Ouverture…' : 'Service client' }}</span>
</button>
