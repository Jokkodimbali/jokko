<div
  *ngIf="feedbackMessage() as message"
  class="app-feedback"
  [class.app-feedback--success]="message.type === 'success'"
  [class.app-feedback--error]="message.type === 'error'"
  [class.app-feedback--info]="message.type === 'info'"
  role="status"
  aria-live="polite"
>
  <span class="app-feedback__icon" aria-hidden="true">
    <lucide-icon name="bell" size="20" [strokeWidth]="2.5"></lucide-icon>
  </span>
  <strong class="app-feedback__copy">{{ message.text }}</strong>
</div>

<router-outlet></router-outlet>
