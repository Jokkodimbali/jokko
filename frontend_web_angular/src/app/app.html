<div
  *ngIf="feedbackMessage() as message"
  class="app-feedback"
  [class.app-feedback--error]="message.type === 'error'"
  [class.app-feedback--info]="message.type === 'info'"
  role="status"
  aria-live="polite"
>
  <span class="app-feedback__icon" aria-hidden="true">
    <lucide-icon [name]="feedbackIcon()" size="20" [strokeWidth]="2.5"></lucide-icon>
  </span>
  <span class="app-feedback__copy">
    <strong>{{ feedbackTitle() }}</strong>
    <small>{{ message.text }}</small>
  </span>
</div>

<router-outlet></router-outlet>
