<app-account-shell
  title="Mes favoris"
  subtitle="Retrouvez rapidement les prestataires et medecins que vous avez gardes de cote."
>
  <section *ngIf="favorites().length > 0; else emptyFavorites" class="favorites-page__grid">
    <article *ngFor="let favorite of favorites()" class="favorites-page__card">
      <a [routerLink]="favorite.route" class="favorites-page__link">
        <img *ngIf="favorite.imageUrl; else favoriteInitials" [src]="favorite.imageUrl" [alt]="favorite.name" />
        <ng-template #favoriteInitials>
          <span class="favorites-page__initials">{{ favorite.name[0] }}</span>
        </ng-template>

        <span>
          <strong>{{ favorite.name }}</strong>
          <small>{{ favorite.subtitle }}</small>
          <em>{{ favorite.location }}</em>
        </span>
      </a>

      <button type="button" aria-label="Retirer des favoris" (click)="removeFavorite(favorite.id)">
        <lucide-icon name="heart" size="24" [strokeWidth]="2.3" fill="#865221"></lucide-icon>
      </button>
    </article>
  </section>

  <ng-template #emptyFavorites>
    <section class="favorites-page__empty">
      <lucide-icon name="heart" size="42" [strokeWidth]="2.2"></lucide-icon>
      <h2>Aucun favori pour le moment</h2>
      <p>Ajoutez un prestataire depuis une page detail pour le retrouver ici.</p>
      <a routerLink="/services">Explorer les services</a>
    </section>
  </ng-template>
</app-account-shell>
