<main class="admin-page">
  <aside class="admin-sidebar" aria-label="Navigation administration">
    <a routerLink="/services" class="admin-sidebar__brand" aria-label="Accueil Jokko Dimbali">
      <img src="/logojokko.png" alt="" />
    </a>
    <a routerLink="/services" class="admin-sidebar__back">
      <lucide-icon name="arrow-left" size="18" [strokeWidth]="2.4"></lucide-icon>
      Revenir au site
    </a>

    <nav>
      <button
        *ngFor="let item of navItems"
        type="button"
        [class.admin-sidebar__item--active]="activeSection() === item.key"
        (click)="selectSection(item.key)"
      >
        <lucide-icon [name]="item.icon" size="19" [strokeWidth]="2.2"></lucide-icon>
        <span>{{ item.label }}</span>
        <b *ngIf="item.badge && item.badge() > 0">{{ formatBadge(item.badge()) }}</b>
      </button>
    </nav>
  </aside>

  <section class="admin-content">
    <header class="admin-topbar">
      <p><span>Console</span> / <strong>Administration</strong></p>
      <label>
        <lucide-icon name="search" size="18" [strokeWidth]="2.2"></lucide-icon>
        <input type="search" placeholder="Recherche, prestataire, litige, transaction..." />
      </label>
      
    </header>

    <ng-container *ngIf="dashboard() as data; else adminState">
      <ng-container *ngIf="activeSection() === 'validations'; else nonValidationContent">
        <app-admin-kyc-validation-panel
          [profiles]="kycProfiles()"
          [isLoading]="isKycLoading()"
          [actionId]="kycActionId()"
          (approve)="approveKyc($event)"
          (reject)="rejectKyc($event)"
          (detailRequested)="loadKycDetail($event)"
        ></app-admin-kyc-validation-panel>
      </ng-container>

      <ng-template #nonValidationContent>
        <ng-container *ngIf="activeSection() === 'doctors'; else nonMedicalContent">
          <app-admin-medical-credentials-panel
            *ngIf="!isMedicalLoading(); else medicalLoading"
            [profiles]="medicalCredentialProfiles()"
            [actionId]="kycActionId()"
            (certify)="certifyMedical($event)"
            (reject)="rejectMedical($event)"
          ></app-admin-medical-credentials-panel>
        </ng-container>
      </ng-template>

      <ng-template #nonMedicalContent>
        <ng-container *ngIf="activeSection() === 'disputes'; else nonDisputesContent">
          <app-admin-disputes-panel
            [disputes]="disputeCases()"
            [isLoading]="isDisputesLoading()"
            [actionId]="kycActionId()"
            (action)="handleDisputeAction($event)"
            (detailRequested)="loadDisputeDetail($event)"
          ></app-admin-disputes-panel>
        </ng-container>
      </ng-template>

      <ng-template #nonDisputesContent>
        <ng-container *ngIf="activeSection() === 'providers'; else nonProvidersContent">
          <app-admin-providers-panel
            [providers]="providerProfiles()"
            [isLoading]="isProvidersLoading()"
            [isActionLoading]="isProviderActionLoading()"
            [pagination]="providerPagination()"
            [stats]="providerStats()"
            [selectedProviderId]="selectedProviderId()"
            [selectedProviderDetail]="selectedProviderDetail()"
            (queryChange)="loadProviders($event)"
            (detailRequested)="loadProviderDetail($event)"
            (detailClosed)="closeProviderDetail()"
            (activationChange)="handleProviderActivation($event)"
          ></app-admin-providers-panel>
        </ng-container>
      </ng-template>

      <ng-template #nonProvidersContent>
        <ng-container *ngIf="activeSection() === 'users'; else nonUsersContent">
          <app-admin-users-panel></app-admin-users-panel>
        </ng-container>
      </ng-template>

      <ng-template #nonUsersContent>
        <ng-container *ngIf="activeSection() === 'reservations'; else nonReservationsContent">
          <app-admin-reservations-panel></app-admin-reservations-panel>
        </ng-container>
      </ng-template>

      <ng-template #nonReservationsContent>
        <ng-container *ngIf="activeSection() === 'payments'; else nonPaymentsContent">
          <app-admin-payments-panel></app-admin-payments-panel>
        </ng-container>
      </ng-template>

      <ng-template #nonPaymentsContent>
        <ng-container *ngIf="activeSection() === 'notifications'; else nonNotificationsContent">
          <app-admin-notifications-panel></app-admin-notifications-panel>
        </ng-container>
      </ng-template>

      <ng-template #nonNotificationsContent>
        <ng-container *ngIf="activeSection() === 'traffic'; else nonTrafficContent">
          <app-admin-traffic-analytics-panel [data]="data"></app-admin-traffic-analytics-panel>
        </ng-container>
      </ng-template>

      <ng-template #nonTrafficContent>
        <ng-container *ngIf="activeSection() === 'revenue'; else nonRevenueContent">
          <app-admin-revenue-panel
            [report]="revenueReport()"
            [isLoading]="isRevenueLoading()"
            (periodChange)="loadRevenue($event)"
          ></app-admin-revenue-panel>
        </ng-container>
      </ng-template>

      <ng-template #nonRevenueContent>
        <ng-container *ngIf="activeSection() === 'regions'; else nonRegionsContent">
          <app-admin-regions-panel
            [report]="regionsReport()"
            [isLoading]="isRegionsLoading()"
          ></app-admin-regions-panel>
        </ng-container>
      </ng-template>

      <ng-template #nonRegionsContent>
        <ng-container *ngIf="activeSection() === 'archives'; else nonArchivesContent">
          <app-admin-archives-panel
            [report]="archivesReport()"
            [isLoading]="isArchivesLoading()"
            (pageChange)="loadArchives($event)"
          ></app-admin-archives-panel>
        </ng-container>
      </ng-template>

      <ng-template #nonArchivesContent>
        <ng-container *ngIf="activeSection() === 'structure'; else overviewContent">
          <app-admin-service-structure-panel
            [report]="serviceStructureReport()"
            [isLoading]="isStructureLoading()"
            [actionId]="structureActionId()"
            (createCategory)="createCategory($event)"
            (bulkCreateCategories)="bulkCreateCategories($event)"
            (updateCategory)="updateCategory($event)"
            (disableCategory)="disableCategory($event)"
            (createSubCategory)="createSubCategory($event)"
            (bulkCreateSubCategories)="bulkCreateSubCategories($event)"
            (assignSubCategories)="assignSubCategories($event)"
          ></app-admin-service-structure-panel>
        </ng-container>
      </ng-template>

      <ng-template #medicalLoading>
        <section class="admin-validation-empty">Chargement des diplomes medecins...</section>
      </ng-template>

      <ng-template #overviewContent>
        <app-admin-overview-panel [data]="data" [userName]="user()?.name"></app-admin-overview-panel>
      </ng-template>
    </ng-container>

    <ng-template #adminState>
      <section class="admin-empty">
        <lucide-icon *ngIf="isLoading()" name="sliders-horizontal" size="36" [strokeWidth]="2.2"></lucide-icon>
        <lucide-icon *ngIf="!isLoading()" name="triangle-alert" size="36" [strokeWidth]="2.2"></lucide-icon>
        <h1>{{ isLoading() ? 'Chargement administration' : 'Tableau de bord indisponible' }}</h1>
        <p>{{ isLoading() ? 'Actualisation des donnees de la console.' : 'Impossible de charger les donnees admin pour le moment.' }}</p>
      </section>
    </ng-template>
  </section>
</main>
