<div
  class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8 relative overflow-hidden"
>
  <!-- Decorative Background Elements -->
  <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
    <div
      class="absolute top-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-primary/15 blur-3xl"
    ></div>
    <div
      class="absolute -bottom-[20%] right-[10%] w-[60%] h-[60%] rounded-full bg-primary/10 blur-3xl"
    ></div>
  </div>

  <!-- Back to Home Button -->
  <div class="absolute top-6 left-6 z-20">
    <a
      routerLink="/"
      class="group flex items-center gap-2 px-4 py-2 bg-white/50 backdrop-blur-md border border-white/40 rounded-full text-sm font-semibold text-gray-700 hover:bg-white hover:shadow-lg transition-all duration-300"
    >
      <svg
        class="w-5 h-5 transform group-hover:-translate-x-1 transition-transform"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M10 19l-7-7m0 0l7-7m-7 7h18"
        />
      </svg>
      Retour à l'accueil
    </a>
  </div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md relative z-10">
    <div class="flex justify-center mb-6">
      <div
        class="w-24 h-24 bg-primary rounded-3xl shadow-xl flex items-center justify-center transform transition-transform hover:scale-105 duration-300"
      >
        <svg class="h-12 w-12 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
          />
        </svg>
      </div>
    </div>
    <h2 class="text-center text-3xl font-extrabold text-gray-900 tracking-tight">
      Vérification OTP
    </h2>
    <p class="mt-2 text-center text-sm text-gray-600 px-4">
      Un code à 6 chiffres a été envoyé au <br />
      <span class="font-bold text-gray-900">{{ phoneNumber() }}</span>
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md relative z-10">
    <div
      class="bg-white/80 backdrop-blur-xl py-8 px-4 shadow-2xl shadow-primary/10 sm:rounded-3xl sm:px-10 border border-white/40"
    >
      <!-- Back Button -->
      <div class="mb-6">
        <a
          routerLink="/auth/login"
          class="inline-flex items-center text-sm font-medium text-gray-500 hover:text-primary transition-colors duration-200"
        >
          <svg class="w-5 h-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10 19l-7-7m0 0l7-7m-7 7h18"
            />
          </svg>
          Retour
        </a>
      </div>

      <!-- Error Message -->
      <div
        *ngIf="errorMessage()"
        class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-md flex items-center animate-fade-in"
      >
        <svg class="h-5 w-5 text-red-500 mr-3" fill="currentColor" viewBox="0 0 20 20">
          <path
            fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
            clip-rule="evenodd"
          />
        </svg>
        <p class="text-sm text-red-700 font-medium">{{ errorMessage() }}</p>
      </div>

      <div
        *ngIf="successMessage()"
        class="mb-6 bg-emerald-50 border-l-4 border-emerald-500 p-4 rounded-md flex items-center animate-fade-in"
      >
        <p class="text-sm text-emerald-700 font-medium">{{ successMessage() }}</p>
      </div>

      <form [formGroup]="otpForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label for="code" class="block text-sm font-semibold text-gray-700 text-center mb-2"
            >Entrez le code</label
          >
          <div class="mt-1 relative flex justify-center">
            <input
              id="code"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="6"
              formControlName="code"
              class="block w-64 text-center text-3xl tracking-[0.2em] px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary/50 focus:border-primary bg-white transition-all duration-200 placeholder-gray-300"
              [ngClass]="{
                'border-red-300 focus:ring-red-500 focus:border-red-500': isFieldInvalid('code'),
              }"
              placeholder="••••••"
            />
          </div>
          <p *ngIf="isFieldInvalid('code')" class="mt-2 text-sm text-red-600 text-center">
            {{ messages.otpCodeInvalid }}
          </p>
        </div>

        <div>
          <button
            type="submit"
            [disabled]="isLoading() || otpForm.invalid"
            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transform transition-all duration-200 disabled:opacity-70 disabled:cursor-not-allowed hover:-translate-y-0.5 active:translate-y-0"
          >
            <svg
              *ngIf="isLoading()"
              class="animate-spin -ml-1 mr-3 h-5 w-5 text-white"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
            <span *ngIf="!isLoading()">Vérifier</span>
            <span *ngIf="isLoading()">Vérification...</span>
          </button>
        </div>
      </form>

      <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">
          Vous n'avez pas reçu le code ?
          <button
            type="button"
            (click)="resendOtp()"
            [disabled]="isResending()"
            class="font-medium text-primary hover:text-primary-dark transition-colors duration-200 focus:outline-none focus:underline disabled:cursor-not-allowed disabled:opacity-60"
          >
            {{ isResending() ? 'Envoi...' : 'Renvoyer' }}
          </button>
        </p>
      </div>
    </div>
  </div>
</div>
