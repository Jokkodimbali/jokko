<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8 relative overflow-hidden">
  <!-- Decorative Background Elements -->
  <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-[30%] -right-[10%] w-[70%] h-[70%] rounded-full bg-primary/10 blur-3xl"></div>
    <div class="absolute -bottom-[30%] -left-[10%] w-[70%] h-[70%] rounded-full bg-primary/20 blur-3xl"></div>
  </div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md relative z-10">
    <div class="flex justify-center mb-6">
      <img src="logo.png" alt="Jokko Logo" class="w-32 h-32 object-contain transform transition-transform hover:scale-105 duration-300">
    </div>
    <h2 class="text-center text-3xl font-extrabold text-gray-900 tracking-tight">
      Rejoignez Jokko
    </h2>
    <p class="mt-2 text-center text-sm text-gray-600">
      Déjà inscrit ? <a routerLink="/auth/login" class="font-medium text-primary hover:text-primary-dark transition-colors duration-200">Connectez-vous ici</a>
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md relative z-10">
    <!-- Glassmorphism Card -->
    <div class="bg-white/80 backdrop-blur-xl py-8 px-4 shadow-2xl shadow-primary/10 sm:rounded-3xl sm:px-10 border border-white/40">
      
      <!-- Back Button -->
      <div class="mb-6">
        <a routerLink="/auth/login" class="inline-flex items-center text-sm font-medium text-gray-500 hover:text-primary transition-colors duration-200">
          <svg class="w-5 h-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          Retour
        </a>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage()" class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-md flex items-center animate-fade-in">
        <svg class="h-5 w-5 text-red-500 mr-3" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
        </svg>
        <p class="text-sm text-red-700 font-medium">{{ errorMessage() }}</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-5">
        
        <!-- Role Selection -->
        <div class="grid grid-cols-2 gap-4 mb-2">
          <label class="relative block cursor-pointer group">
            <input type="radio" name="role" formControlName="role" value="CLIENT" class="peer sr-only">
            <div class="flex flex-col items-center p-4 bg-gray-50 border-2 border-transparent rounded-2xl transition-all duration-300 peer-checked:border-primary peer-checked:bg-primary/5 hover:bg-gray-100 group-hover:scale-[1.02]">
              <div class="w-12 h-12 bg-white rounded-full shadow-sm flex items-center justify-center mb-2 peer-checked:text-primary transition-all">
                <svg class="w-6 h-6 text-gray-400 peer-checked:text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              </div>
              <span class="text-xs font-bold uppercase tracking-wider text-gray-500 peer-checked:text-primary">Client</span>
            </div>
          </label>
          <label class="relative block cursor-pointer group">
            <input type="radio" name="role" formControlName="role" value="PRESTATAIRE" class="peer sr-only">
            <div class="flex flex-col items-center p-4 bg-gray-50 border-2 border-transparent rounded-2xl transition-all duration-300 peer-checked:border-primary peer-checked:bg-primary/5 hover:bg-gray-100 group-hover:scale-[1.02]">
              <div class="w-12 h-12 bg-white rounded-full shadow-sm flex items-center justify-center mb-2 peer-checked:text-primary transition-all">
                <svg class="w-6 h-6 text-gray-400 peer-checked:text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
              </div>
              <span class="text-xs font-bold uppercase tracking-wider text-gray-500 peer-checked:text-primary">Prestataire</span>
            </div>
          </label>
        </div>
        
        <!-- Name & Phone Group -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Name Input -->
          <div>
            <label for="name" class="block text-sm font-semibold text-gray-700">Nom complet</label>
            <div class="mt-1 relative rounded-xl shadow-sm">
              <input 
                id="name" 
                type="text" 
                formControlName="name"
                class="block w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/50 focus:border-primary bg-gray-50 transition-all duration-200 placeholder-gray-400 sm:text-sm"
                [ngClass]="{'border-red-300 focus:ring-red-500 focus:border-red-500': isFieldInvalid('name')}"
                placeholder="Moussa Diop">
            </div>
            <p *ngIf="isFieldInvalid('name')" class="mt-1 text-[10px] text-red-600">Nom invalide (2-100 car.).</p>
          </div>

          <!-- Phone Number Input -->
          <div>
            <label for="phoneNumber" class="block text-sm font-semibold text-gray-700">Téléphone</label>
            <div class="mt-1 relative rounded-xl shadow-sm">
              <input 
                id="phoneNumber" 
                type="tel" 
                formControlName="phoneNumber"
                class="block w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/50 focus:border-primary bg-gray-50 transition-all duration-200 placeholder-gray-400 sm:text-sm"
                [ngClass]="{'border-red-300 focus:ring-red-500 focus:border-red-500': isFieldInvalid('phoneNumber')}"
                placeholder="+221...">
            </div>
            <p *ngIf="isFieldInvalid('phoneNumber')" class="mt-1 text-[10px] text-red-600">Numéro invalide.</p>
          </div>
        </div>

        <!-- Email & Address Group -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Email Input (Optional) -->
          <div>
            <label for="email" class="block text-sm font-semibold text-gray-700">Email <span class="text-gray-400 font-normal text-[10px]">(Opt.)</span></label>
            <div class="mt-1 relative rounded-xl shadow-sm">
              <input 
                id="email" 
                type="email" 
                formControlName="email"
                class="block w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/50 focus:border-primary bg-gray-50 transition-all duration-200 placeholder-gray-400 sm:text-sm"
                [ngClass]="{'border-red-300 focus:ring-red-500 focus:border-red-500': isFieldInvalid('email')}"
                placeholder="moussa@ex.com">
            </div>
          </div>

          <!-- Address Input -->
          <div>
            <label for="adresse" class="block text-sm font-semibold text-gray-700">Adresse</label>
            <div class="mt-1 relative rounded-xl shadow-sm">
              <input 
                id="adresse" 
                type="text" 
                formControlName="adresse"
                class="block w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/50 focus:border-primary bg-gray-50 transition-all duration-200 placeholder-gray-400 sm:text-sm"
                [ngClass]="{'border-red-300 focus:ring-red-500 focus:border-red-500': isFieldInvalid('adresse')}"
                placeholder="Dakar...">
            </div>
          </div>
        </div>

        <!-- Password Input -->
        <div>
          <label for="password" class="block text-sm font-semibold text-gray-700">Mot de passe</label>
          <div class="mt-1 relative rounded-xl shadow-sm">
            <input 
              id="password" 
              [type]="showPassword() ? 'text' : 'password'" 
              formControlName="password"
              class="block w-full px-4 pr-10 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/50 focus:border-primary bg-gray-50 transition-all duration-200 placeholder-gray-400 sm:text-sm"
              [ngClass]="{'border-red-300 focus:ring-red-500 focus:border-red-500': isFieldInvalid('password')}"
              placeholder="••••••••">
            <button 
              type="button" 
              (click)="showPassword.set(!showPassword())"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none transition-colors duration-200">
              <svg *ngIf="!showPassword()" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <svg *ngIf="showPassword()" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            </button>
          </div>
        </div>

        <div class="pt-2">
          <button 
            type="submit" 
            [disabled]="isLoading() || registerForm.invalid"
            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transform transition-all duration-200 disabled:opacity-70 disabled:cursor-not-allowed hover:-translate-y-0.5 active:translate-y-0">
            <svg *ngIf="isLoading()" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span *ngIf="!isLoading()">S'inscrire</span>
            <span *ngIf="isLoading()">Création en cours...</span>
          </button>
        </div>
      </form>
      
    </div>
  </div>
</div>
