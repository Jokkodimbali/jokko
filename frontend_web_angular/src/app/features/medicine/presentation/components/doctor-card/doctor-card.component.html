<a
  class="doctor-card"
  [routerLink]="['/medecine', doctor.id]"
  [state]="{ doctor: doctor }"
>
  <button
    type="button"
    class="doctor-card__favorite"
    [class.doctor-card__favorite--active]="isFavorite()"
    [disabled]="isTogglingFavorite()"
    [attr.aria-label]="isFavorite() ? 'Retirer des favoris' : 'Ajouter aux favoris'"
    (click)="toggleFavorite($event)"
  >
    <lucide-icon name="heart" size="16" [strokeWidth]="1.8" [attr.fill]="isFavorite() ? 'currentColor' : 'none'"></lucide-icon>
  </button>

  <div class="doctor-card__summary">
    <div class="doctor-card__portrait">
      <img
        *ngIf="visibleImageUrl(doctor.imageUrl) as imageUrl; else doctorPortraitInitials"
        [src]="imageUrl"
        [alt]="doctor.name"
        (error)="handleImageError(imageUrl)"
      />
      <ng-template #doctorPortraitInitials>
        <span class="doctor-card__portrait-initials">{{ doctorInitials() }}</span>
      </ng-template>
      <span class="doctor-card__status" [class.doctor-card__status--offline]="!doctor.isOnline">
        <i aria-hidden="true"></i>
        {{ doctor.isOnline ? messages.status.online : messages.status.offline }}
      </span>
    </div>

    <div class="doctor-card__identity">
      <h2>{{ doctor.name }}</h2>
      <p>{{ doctor.specialty }}</p>
      <div class="doctor-card__rating">
        <lucide-icon name="star" size="15" [strokeWidth]="0" fill="#ffb21b"></lucide-icon>
        <strong>{{ doctor.rating }}</strong>
        <span>({{ doctor.reviewCount }})</span>
        <i aria-hidden="true" class="doctor-card__dot"></i>
        <lucide-icon name="map-pin" size="12" [strokeWidth]="2"></lucide-icon>
        <span>{{ doctor.location }}</span>
      </div>

      <div class="doctor-card__modes" *ngIf="doctor.modes.length > 0">
        <span *ngFor="let mode of doctor.modes" [class.doctor-card__mode--remote]="mode === messages.modes.remote">
          <lucide-icon *ngIf="mode === messages.modes.remote" name="video" size="14" [strokeWidth]="2"></lucide-icon>
          {{ mode }}
        </span>
      </div>
    </div>
  </div>

  <section class="doctor-card__availability" aria-label="Prochaines disponibilites">
    <h3>
      <lucide-icon name="clock-3" size="13" [strokeWidth]="2"></lucide-icon>
      {{ messages.nextAvailability }}
    </h3>

    <div class="doctor-card__days" *ngIf="doctor.nextAvailability.length > 0; else noAvailability">
      <span *ngFor="let day of doctor.nextAvailability">{{ day }}</span>
    </div>
    <ng-template #noAvailability>
      <p class="doctor-card__empty-availability">{{ messages.noAvailability }}</p>
    </ng-template>
  </section>

  <button type="button" class="doctor-card__cta" (click)="openBooking($event)">
    {{ messages.appointment }}
    <span>
      <lucide-icon name="arrow-up-right" size="13" [strokeWidth]="2.3"></lucide-icon>
    </span>
  </button>
</a>
