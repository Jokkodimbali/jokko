<div class="medicine-filter-bar" aria-label="Filtres medecine">
  <button
    *ngFor="let filter of filters"
    type="button"
    class="medicine-filter-bar__button"
    [class.medicine-filter-bar__button--accent]="filter.variant === 'accent'"
    [class.medicine-filter-bar__button--active]="activeMap && filter.icon === 'map'"
    (click)="filterSelected.emit(filter)"
  >
    <lucide-icon [name]="filter.icon" size="23" [strokeWidth]="2.35"></lucide-icon>
    <span>{{ filter.label }}</span>
  </button>
</div>
