<aside class="doctor-space-sidebar">
  <div class="doctor-space-sidebar__head">
    <button
      type="button"
      class="doctor-space-sidebar__back"
      (click)="backRequested.emit()"
      aria-label="Retour"
    >
      <lucide-icon name="arrow-left" size="31" [strokeWidth]="2.6"></lucide-icon>
    </button>
    <div class="doctor-space-sidebar__identity">
      <small>Mon espace</small>
      <strong>{{ ariaLabel }}</strong>
    </div>
  </div>

  <nav [attr.aria-label]="ariaLabel">
    <button
      *ngIf="showPharmacySection"
      type="button"
      class="doctor-space-sidebar__nav-item--pharmacy"
      [class.doctor-space-sidebar__nav-item--active]="activeSection === 'pharmacy'"
      (click)="pharmacyRequested.emit()"
    >
      <lucide-icon name="pill" size="34" [strokeWidth]="2.1"></lucide-icon>
      <span>Espace pharmacie</span>
    </button>
    <button
      *ngIf="showHardwareStoreSection"
      type="button"
      class="doctor-space-sidebar__nav-item--pharmacy doctor-space-sidebar__nav-item--hardware"
      (click)="hardwareStoreRequested.emit()"
    >
      <lucide-icon name="package-search" size="20" [strokeWidth]="2.2"></lucide-icon>
      <span>Demandes materiel</span>
    </button>
    <button
      *ngIf="showNegotiationsSection"
      type="button"
      [class.doctor-space-sidebar__nav-item--active]="activeSection === 'negotiations'"
      (click)="sectionSelected.emit('negotiations')"
    >
      <lucide-icon name="handshake" size="34" [strokeWidth]="2.1"></lucide-icon>
      <span>RDV et N&eacute;gociation clients</span>
    </button>
    <button
      *ngIf="showPatientAppointmentsSection"
      type="button"
      [class.doctor-space-sidebar__nav-item--active]="activeSection === 'patient-appointments'"
      (click)="sectionSelected.emit('patient-appointments')"
    >
      <lucide-icon name="calendar-check" size="34" [strokeWidth]="2.1"></lucide-icon>
      <span>RDV patients</span>
    </button>
    <button
      type="button"
      [class.doctor-space-sidebar__nav-item--active]="activeSection === 'availability'"
      (click)="sectionSelected.emit('availability')"
    >
      <lucide-icon name="calendar-days" size="34" [strokeWidth]="2.1"></lucide-icon>
      <span>Disponibilit&eacute;s</span>
    </button>
    <button
      *ngIf="showConsultationSection"
      type="button"
      [class.doctor-space-sidebar__nav-item--active]="activeSection === 'consultation'"
      (click)="sectionSelected.emit('consultation')"
    >
      <lucide-icon name="clipboard" size="34" [strokeWidth]="2.1"></lucide-icon>
      <span>{{ serviceSectionLabel }}</span>
    </button>
    <button
      type="button"
      [class.doctor-space-sidebar__nav-item--active]="activeSection === 'agenda'"
      (click)="sectionSelected.emit('agenda')"
    >
      <lucide-icon name="calendar-days" size="34" [strokeWidth]="2.1"></lucide-icon>
      <span>{{ agendaSectionLabel }}</span>
    </button>
    <button
      type="button"
      [class.doctor-space-sidebar__nav-item--active]="activeSection === 'medical-history'"
      (click)="sectionSelected.emit('medical-history')"
    >
      <lucide-icon name="file-text" size="34" [strokeWidth]="2.1"></lucide-icon>
      <span>{{ appointmentHistorySectionLabel }}</span>
    </button>
    <button
      type="button"
      [class.doctor-space-sidebar__nav-item--active]="activeSection === 'wallet'"
      (click)="sectionSelected.emit('wallet')"
    >
      <lucide-icon name="wallet-cards" size="34" [strokeWidth]="2.1"></lucide-icon>
      <span>Wallet</span>
    </button>
  </nav>
</aside>
