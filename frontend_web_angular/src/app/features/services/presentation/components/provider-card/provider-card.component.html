<article
  class="provider-card"
  role="link"
  tabindex="0"
  [attr.aria-label]="'Voir le detail de ' + provider.name"
  (click)="openProfile()"
  (keydown)="openProfileFromKeyboard($event)"
>
  <div class="provider-card__top">
    <app-provider-travel-badge
      [label]="provider.movementTitle"
      [imageUrl]="movementImageUrl"
      [icons]="movementIcons"
      [tone]="provider.travelMode || 'DEFAULT'"
    />

    <button
      type="button"
      class="provider-card__favorite"
      [class.provider-card__favorite--active]="isFavorite"
      [attr.aria-label]="isFavorite ? favoriteActiveLabel : favoriteLabel"
      (click)="onFavoriteClick($event)"
    >
      <lucide-icon
        name="bookmark"
        size="19"
        [strokeWidth]="2.5"
        [attr.fill]="isFavorite ? 'currentColor' : 'none'"
      ></lucide-icon>
    </button>
  </div>

  <div class="provider-card__head">
    <a
      class="provider-card__avatar"
      [routerLink]="provider.profileCommands"
      [queryParams]="provider.queryParams"
      [state]="provider.state"
      [attr.aria-label]="'Voir le profil de ' + provider.name"
      (click)="stopCardNavigation($event)"
    >
      <img
        *ngIf="provider.avatarUrl; else avatarInitials"
        [src]="provider.avatarUrl"
        [alt]="provider.name"
        (error)="onImageError(provider.avatarUrl)"
      />
      <ng-template #avatarInitials>
        <span>{{ provider.initials }}</span>
      </ng-template>
      <app-presence-dot
        [userId]="provider.userId"
        [professionalId]="provider.id"
        [initialOnline]="provider.isOnline"
      />
    </a>

    <div class="provider-card__identity">
      <span>{{ provider.category }}</span>
      <a
        [routerLink]="provider.profileCommands"
        [queryParams]="provider.queryParams"
        [state]="provider.state"
        (click)="stopCardNavigation($event)"
      >
        {{ provider.name }}
      </a>
      <small class="provider-card__location-main">
        <lucide-icon name="map-pin" size="12" [strokeWidth]="2.1"></lucide-icon>
        <span>{{ provider.location }}</span>
      </small>
    </div>

    <div class="provider-card__meta">
      <strong>{{ provider.priceRangeLabel }}</strong>
      <app-star-rating [value]="provider.rating" [reviews]="provider.totalReviews" size="medium" />
      <small>{{ provider.totalReviews }} avis</small>
    </div>
  </div>

  <div class="provider-card__body">
    <h3>Les services propose</h3>

    <section class="provider-card__services" *ngIf="selectedService as selected; else emptyGallery">
      <figure class="provider-card__service-main">
        <ng-container *ngIf="selected.imageUrl; else serviceFallback">
          <img
            class="provider-card__service-image-backdrop"
            [src]="selected.imageUrl"
            alt=""
            aria-hidden="true"
          />
          <img
            class="provider-card__service-image"
            [class.provider-card__service-image--landscape]="isLandscapeImage(selected.imageUrl)"
            [src]="selected.imageUrl"
            [alt]="selected.name"
            (load)="onServiceImageLoad($event, selected.imageUrl)"
            (error)="onImageError(selected.imageUrl)"
          />
        </ng-container>
        <ng-template #serviceFallback>
          <span class="provider-card__service-image-fallback" aria-label="Aucune image disponible">
            <lucide-icon
              name="image-plus"
              size="44"
              [strokeWidth]="1.8"
              aria-hidden="true"
            ></lucide-icon>
            <strong>Aucune image</strong>
          </span>
        </ng-template>

        <app-provider-travel-badge
          *ngIf="vehicleBadge as vehicle"
          variant="vehicle"
          [label]="vehicle.label"
          [imageUrl]="vehicle.imageUrl"
          [overlay]="true"
        />

        <div class="provider-card__service-thumbs" aria-label="Services proposes">
          <button
            *ngFor="let service of serviceVisuals"
            type="button"
            [class.provider-card__service-thumb--active]="selected.id === service.id"
            (click)="selectService($event, service)"
          >
            <span>
              <img
                *ngIf="service.imageUrl; else thumbFallback"
                [src]="service.imageUrl"
                [alt]="service.name"
                (error)="onImageError(service.imageUrl)"
              />
              <ng-template #thumbFallback
                ><strong>{{ serviceInitials(service.name) }}</strong></ng-template
              >
            </span>
          </button>
        </div>
      </figure>

      <div class="provider-card__service-labels">
        <button
          *ngFor="let service of serviceVisuals"
          type="button"
          [class.provider-card__service-label--active]="selected.id === service.id"
          (click)="selectService($event, service)"
        >
          {{ service.name }}
        </button>
      </div>
    </section>
    <ng-template #emptyGallery>
      <div class="provider-card__empty-service">
        <lucide-icon name="image-plus" size="18" [strokeWidth]="2.2"></lucide-icon>
      </div>
    </ng-template>

    <div class="provider-card__actions">
      <button
        type="button"
        class="provider-card__action provider-card__action--message"
        (click)="openMessages($event)"
      >
        <lucide-icon name="message-circle" size="14" [strokeWidth]="2.4"></lucide-icon>
        <span>Message</span>
      </button>
      <button
        type="button"
        class="provider-card__action provider-card__action--primary"
        [class.provider-card__action--medical]="provider.isMedical"
        (click)="onPrimaryActionClick($event)"
      >
        <lucide-icon
          [name]="provider.isMedical ? 'calendar-check' : 'banknote-arrow-down'"
          size="14"
          [strokeWidth]="2.4"
        ></lucide-icon>
        <span>{{ provider.primaryActionLabel }}</span>
      </button>
    </div>
  </div>
</article>
