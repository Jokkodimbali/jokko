<section class="service-proposal__accepted" aria-label="Prestation acceptee">
  <header class="service-proposal__accepted-hero">
    <div class="service-proposal__accepted-avatar">
      <img *ngIf="avatarUrl; else acceptedInitials" [src]="avatarUrl" [alt]="avatarAlt" />
      <ng-template #acceptedInitials>
        <span>{{ initials }}</span>
      </ng-template>
      <i aria-hidden="true">
        <lucide-icon name="check" size="17" [strokeWidth]="3"></lucide-icon>
      </i>
    </div>
    <small>{{ eyebrow }}</small>
    <h1>{{ title }}</h1>
    <p>{{ descriptionPrefix }} <strong>{{ descriptionStrong }}</strong></p>
  </header>

  <div class="service-proposal__accepted-body">
    <div class="service-proposal__accepted-price">
      <span>
        <small>{{ pricePrimaryLabel }}</small>
        <strong>{{ pricePrimaryValue }} <em *ngIf="pricePrimarySuffix">{{ pricePrimarySuffix }}</em></strong>
      </span>
      <span>
        <small>{{ priceSecondaryLabel }}</small>
        <strong>{{ priceSecondaryValue }}</strong>
      </span>
    </div>

    <div class="service-proposal__accepted-row">
      <span>
        <lucide-icon name="calendar-days" size="17" [strokeWidth]="2.3"></lucide-icon>
      </span>
      <p>
        <small>Date &amp; heure</small>
        <strong>{{ dateValue }}</strong>
      </p>
    </div>

    <div class="service-proposal__accepted-row">
      <span>
        <lucide-icon name="map-pin" size="17" [strokeWidth]="2.3"></lucide-icon>
      </span>
      <p>
        <small>Adresse</small>
        <strong>{{ addressValue }}</strong>
      </p>
    </div>
  </div>
</section>

<button type="button" class="service-proposal__accepted-message" (click)="action.emit()">
  <lucide-icon [name]="actionIcon" size="17" [strokeWidth]="2.4"></lucide-icon>
  {{ actionLabel }}
</button>
