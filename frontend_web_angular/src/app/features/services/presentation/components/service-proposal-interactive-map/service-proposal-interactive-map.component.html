<div class="interactive-map" [class.interactive-map--expanded]="expanded">
  <div class="interactive-map__toolbar">
    <form class="interactive-map__search" (ngSubmit)="submitSearch()">
      <lucide-icon name="search" size="14" [strokeWidth]="2.4" />
      <input
        type="search"
        name="addressSearch"
        autocomplete="off"
        aria-label="Rechercher une adresse"
        placeholder="Rechercher une avenue, quartier, lieu..."
        [ngModel]="searchQuery"
        (ngModelChange)="updateSearch($event)"
        (focus)="showAddressSuggestions()"
        (blur)="hideAddressSuggestionsSoon()"
      />
      <button type="submit" [disabled]="isSearching" aria-label="Rechercher l'adresse">
        <lucide-icon
          [name]="isSearching ? 'loader-circle' : 'corner-down-left'"
          size="13"
          [strokeWidth]="2.5"
        />
      </button>
    </form>

    <div
      *ngIf="isLoadingSuggestions() || addressSuggestions().length > 0"
      class="interactive-map__suggestions"
      role="listbox"
      aria-label="Suggestions d'adresse Google"
    >
      <p *ngIf="isLoadingSuggestions() && addressSuggestions().length === 0">
        Recherche des adresses...
      </p>
      <button
        *ngFor="let suggestion of addressSuggestions()"
        type="button"
        role="option"
        (mousedown)="$event.preventDefault()"
        (click)="selectAddressSuggestion(suggestion)"
      >
        <lucide-icon name="map-pin" size="15" [strokeWidth]="2.3" />
        <span>
          <strong>{{ suggestion.label.split(',')[0] }}</strong>
          <small>{{ suggestion.label }}</small>
        </span>
      </button>
      <footer>Suggestions fournies par Google</footer>
    </div>

    <div class="interactive-map__styles" aria-label="Style de carte">
      <button
        type="button"
        [class.active]="mapStyle === 'roadmap'"
        (click)="setMapStyle('roadmap')"
        aria-label="Carte plan"
      >
        <lucide-icon name="map" size="14" [strokeWidth]="2.4" />
      </button>
      <button
        type="button"
        [class.active]="mapStyle === 'satellite'"
        (click)="setMapStyle('satellite')"
        aria-label="Carte satellite"
      >
        <lucide-icon name="globe" size="14" [strokeWidth]="2.4" />
      </button>
    </div>
  </div>

  <div class="interactive-map__canvas-wrap">
    <button
      type="button"
      class="interactive-map__expand"
      (click)="toggleExpanded()"
      *ngIf="!loading"
    >
      <lucide-icon [name]="expanded ? 'minimize-2' : 'maximize-2'" size="11" [strokeWidth]="2.5" />
      {{ expanded ? 'Reduire' : 'Agrandir' }}
    </button>

    <div class="interactive-map__loading" *ngIf="loading">
      <lucide-icon name="loader-circle" size="24" [strokeWidth]="2.4" />
      <span>Chargement de la carte...</span>
    </div>

    <iframe
      *ngIf="!loading && !hasGoogleMap"
      class="interactive-map__fallback"
      title="Carte de Dakar"
      [src]="fallbackMapUrl"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>

    <div
      #mapContainer
      class="interactive-map__canvas"
      [class.interactive-map__canvas--hidden]="!hasGoogleMap"
    ></div>
  </div>

  <p class="interactive-map__status" *ngIf="geocodingStatus">
    <lucide-icon name="check" size="13" [strokeWidth]="2.6" />
    {{ geocodingStatus }}
  </p>
</div>
