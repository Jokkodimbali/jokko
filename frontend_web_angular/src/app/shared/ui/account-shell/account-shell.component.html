<main class="account-shell">
  <section *ngIf="showHeader" class="account-shell__header">
    <div>
      <p>Jokko Dimbali</p>
      <h1>{{ title }}</h1>
      <span *ngIf="subtitle">{{ subtitle }}</span>
    </div>
  </section>

  <section class="account-shell__content" [class.account-shell__content--wide]="contentWide">
    <ng-content />
  </section>

  <app-footer />
</main>
