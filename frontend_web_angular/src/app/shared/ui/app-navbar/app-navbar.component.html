<header class="app-navbar">
  <div *ngIf="feedbackMessage() as message" class="app-navbar__toast" role="status">
    {{ message.text }}
  </div>

  <!-- Brand Logo -->
  <a class="app-navbar__brand" routerLink="/services" aria-label="Accueil Jokko Dimbali">
    <img [src]="logo" alt="" />
  </a>

  <!-- Desktop Navigation -->
  <nav class="app-navbar__nav" aria-label="Navigation principale">
    <a
      *ngFor="let item of navItems()"
      class="app-navbar__nav-item"
      [class.app-navbar__nav-item--active]="isActive(item.route)"
      [routerLink]="item.route"
    >
      <lucide-icon [name]="item.icon" size="36" [strokeWidth]="2.6"></lucide-icon>
      <span>{{ item.label }}</span>
    </a>
  </nav>

  <!-- Desktop Profile Dropdown Backdrop -->
  <button
    *ngIf="isMenuOpen()"
    type="button"
    class="app-navbar__blur-backdrop"
    aria-label="Fermer le menu profil"
    (click)="closeProfileMenu()"
  ></button>

  <!-- Desktop Actions -->
  <div class="app-navbar__actions">
    <a
      *ngIf="!isAuthenticated(); else connectedProfile"
      routerLink="/auth/login"
      class="app-navbar__login"
      aria-label="Connexion"
    >
      Connexion
    </a>

    <ng-template #connectedProfile>
      <button
        type="button"
        class="app-navbar__profile"
        [class.app-navbar__profile--open]="isMenuOpen()"
        [attr.aria-label]="profileTitle()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-haspopup="menu"
        (click)="toggleProfileMenu()"
      >
        <span class="app-navbar__profile-avatar">
          <img *ngIf="profileAvatarUrl(); else profileInitials" [src]="profileAvatarUrl()!" [alt]="profileName()" />
          <ng-template #profileInitials>{{ profileLabel() }}</ng-template>
        </span>
        <strong>{{ profileName() }}</strong>
        <lucide-icon name="chevron-down" size="30" [strokeWidth]="2.4"></lucide-icon>
      </button>

      <section *ngIf="isMenuOpen()" class="app-navbar__dropdown" role="menu">
        <button
          type="button"
          class="app-navbar__dropdown-account"
          aria-label="Fermer le menu profil"
          (click)="closeProfileMenu()"
        >
          <span class="app-navbar__dropdown-avatar">
            <img *ngIf="profileAvatarUrl(); else dropdownInitials" [src]="profileAvatarUrl()!" [alt]="profileName()" />
            <ng-template #dropdownInitials>{{ profileLabel() }}</ng-template>
          </span>
          <span class="app-navbar__dropdown-account-copy">
            <strong>{{ profileName() }}</strong>
            <small>Connect&eacute;</small>
          </span>
        </button>

        <a routerLink="/favorites" class="app-navbar__dropdown-item" role="menuitem" (click)="closeProfileMenu()">
          <span class="app-navbar__dropdown-icon">
            <lucide-icon name="heart" size="19" [strokeWidth]="2.2"></lucide-icon>
          </span>
          <span>Mes favoris</span>
        </a>
        <a routerLink="/settings" class="app-navbar__dropdown-item" role="menuitem" (click)="closeProfileMenu()">
          <span class="app-navbar__dropdown-icon">
            <lucide-icon name="settings" size="18" [strokeWidth]="2.2"></lucide-icon>
          </span>
          <span>Mes Param&egrave;tres</span>
        </a>
        <a
          *ngIf="showDoctorSpace()"
          routerLink="/medecine/espace"
          class="app-navbar__dropdown-item"
          role="menuitem"
          (click)="closeProfileMenu()"
        >
          <span class="app-navbar__dropdown-icon app-navbar__dropdown-icon--doctor">
            <lucide-icon name="heart-plus" size="18" [strokeWidth]="2.2"></lucide-icon>
          </span>
          <span>Espace M&eacute;decin</span>
        </a>
        <button
          type="button"
          class="app-navbar__dropdown-item"
          role="menuitem"
          [disabled]="isLoggingOut()"
          (click)="logout()"
        >
          <span class="app-navbar__dropdown-icon">
            <lucide-icon name="log-out" size="18" [strokeWidth]="2.2"></lucide-icon>
          </span>
          <span>D&eacute;connexion</span>
        </button>
      </section>
    </ng-template>
  </div>

  <!-- Hamburger Button (visible on mobile/tablet only) -->
  <button
    type="button"
    class="app-navbar__hamburger"
    [class.app-navbar__hamburger--open]="isMobileNavOpen()"
    [attr.aria-expanded]="isMobileNavOpen()"
    aria-label="Ouvrir le menu de navigation"
    (click)="toggleMobileNav()"
  >
    <span class="app-navbar__hamburger-line"></span>
    <span class="app-navbar__hamburger-line"></span>
    <span class="app-navbar__hamburger-line"></span>
  </button>

  <!-- Mobile Overlay -->
  <div
    *ngIf="isMobileNavOpen()"
    class="app-navbar__mobile-overlay"
    (click)="closeMobileNav()"
    aria-hidden="true"
  ></div>

  <!-- Mobile / Tablet Navigation Drawer -->
  <aside
    class="app-navbar__mobile-drawer"
    [class.app-navbar__mobile-drawer--open]="isMobileNavOpen()"
    role="dialog"
    aria-modal="true"
    aria-label="Menu de navigation"
  >
    <!-- Drawer Header -->
    <div class="app-navbar__mobile-drawer-header">
      <a
        class="app-navbar__mobile-drawer-brand"
        routerLink="/services"
        aria-label="Accueil"
        (click)="closeMobileNav()"
      >
        <img [src]="logo" alt="Jokko Dimbali" />
      </a>
      <button
        type="button"
        class="app-navbar__mobile-drawer-close"
        aria-label="Fermer le menu"
        (click)="closeMobileNav()"
      >
        <lucide-icon name="x" size="24" [strokeWidth]="2.5"></lucide-icon>
      </button>
    </div>

    <!-- Mobile Nav Items -->
    <nav class="app-navbar__mobile-nav" aria-label="Navigation mobile">
      <a
        *ngFor="let item of navItems()"
        class="app-navbar__mobile-nav-item"
        [class.app-navbar__mobile-nav-item--active]="isActive(item.route)"
        [routerLink]="item.route"
        (click)="closeMobileNav()"
      >
        <lucide-icon [name]="item.icon" size="24" [strokeWidth]="2.5"></lucide-icon>
        <span>{{ item.label }}</span>
      </a>
    </nav>

    <!-- Mobile Auth Actions -->
    <div class="app-navbar__mobile-actions">
      <ng-container *ngIf="isAuthenticated(); else mobileGuest">
        <div class="app-navbar__mobile-user">
          <span class="app-navbar__mobile-avatar">
            <img *ngIf="profileAvatarUrl(); else mobileInitials" [src]="profileAvatarUrl()!" [alt]="profileName()" />
            <ng-template #mobileInitials>{{ profileLabel() }}</ng-template>
          </span>
          <span class="app-navbar__mobile-username">{{ profileName() }}</span>
        </div>
        <a routerLink="/favorites" class="app-navbar__mobile-action-item" (click)="closeMobileNav()">
          <lucide-icon name="heart" size="22" [strokeWidth]="2.4"></lucide-icon>
          <span>Mes favoris</span>
        </a>
        <a routerLink="/settings" class="app-navbar__mobile-action-item" (click)="closeMobileNav()">
          <lucide-icon name="settings" size="22" [strokeWidth]="2.4"></lucide-icon>
          <span>Mes Param&egrave;tres</span>
        </a>
        <a
          *ngIf="showDoctorSpace()"
          routerLink="/medecine/espace"
          class="app-navbar__mobile-action-item app-navbar__mobile-action-item--doctor"
          (click)="closeMobileNav()"
        >
          <lucide-icon name="heart-plus" size="22" [strokeWidth]="2.4"></lucide-icon>
          <span>Espace M&eacute;decin</span>
        </a>
        <button
          type="button"
          class="app-navbar__mobile-action-item app-navbar__mobile-logout"
          [disabled]="isLoggingOut()"
          (click)="logout()"
        >
          <lucide-icon name="log-out" size="22" [strokeWidth]="2.4"></lucide-icon>
          <span>D&eacute;connexion</span>
        </button>
      </ng-container>

      <ng-template #mobileGuest>
        <a routerLink="/auth/login" class="app-navbar__mobile-login" (click)="closeMobileNav()">
          Connexion
        </a>
        <a routerLink="/settings" class="app-navbar__mobile-action-item" (click)="closeMobileNav()">
          <lucide-icon name="settings" size="22" [strokeWidth]="2.4"></lucide-icon>
          <span>Param&egrave;tres</span>
        </a>
      </ng-template>
    </div>
  </aside>
</header>
