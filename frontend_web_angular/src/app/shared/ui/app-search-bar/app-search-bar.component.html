<form
  class="app-search-bar"
  [class.app-search-bar--compact]="variant === 'compact'"
  [class.app-search-bar--service]="variant === 'service'"
  [class.app-search-bar--panel-open]="isServiceVariant && showSuggestions"
  [attr.aria-label]="ariaLabel"
  (submit)="$event.preventDefault(); onSubmit()"
>
  <div class="app-search-bar__main">
    <button
      type="button"
      class="app-search-bar__location"
      [class.app-search-bar__location--default]="isServiceVariant && locationValue === 'Filtre'"
      [attr.aria-expanded]="isServiceVariant ? showLocationMenu : null"
      (click)="onLocationClick()"
    >
      <lucide-icon
        name="map-pin"
        [size]="isServiceVariant ? 17 : 22"
        [strokeWidth]="isServiceVariant ? 2.4 : 3"
      ></lucide-icon>
      <span><strong>{{ locationTitle }}</strong><em>{{ locationValue }}</em></span>
      <lucide-icon
        *ngIf="isServiceVariant"
        class="app-search-bar__chevron"
        [class.app-search-bar__chevron--open]="showLocationMenu"
        name="chevron-down"
        size="14"
        [strokeWidth]="2.3"
      ></lucide-icon>
    </button>

    <label class="app-search-bar__field">
    <lucide-icon
      name="search"
      [size]="isServiceVariant ? 18 : 35"
      [strokeWidth]="isServiceVariant ? 2.2 : 2.6"
    ></lucide-icon>
    <input
      type="search"
      [value]="value"
      [placeholder]="placeholder"
      (input)="onInputEvent($event)"
      (focus)="onFocus()"
    />
    </label>

    <button
    *ngIf="!isServiceVariant"
    type="button"
    class="app-search-bar__filter"
    aria-label="Ouvrir les filtres"
    (click)="onFilterClick()"
  >
    <lucide-icon name="sliders-horizontal" size="30" [strokeWidth]="3"></lucide-icon>
    <span>
      <strong>{{ filterLabel }}</strong>
      <small *ngIf="filterValueLabel">{{ filterValueLabel }}</small>
    </span>
    </button>

    <button
    *ngIf="isServiceVariant"
    type="button"
    class="app-search-bar__submit"
    aria-label="Filtrer par ville ou position"
    (click)="onServiceSubmitClick()"
  >
    <lucide-icon name="search" size="20" [strokeWidth]="2.5"></lucide-icon>
    <span>Chercher</span>
    </button>
  </div>

  <div
    *ngIf="isServiceVariant && modeOptions.length > 0"
    class="app-search-bar__modes"
    aria-label="Modes de deplacement"
  >
    <span>Mode</span>
    <button
      *ngFor="let option of modeOptions"
      type="button"
      class="app-search-bar__mode"
      [class.app-search-bar__mode--active]="option.value === selectedMode"
      [class.app-search-bar__mode--all]="option.tone === 'all'"
      [class.app-search-bar__mode--client]="option.tone === 'client'"
      [class.app-search-bar__mode--route]="option.tone === 'route'"
      [class.app-search-bar__mode--provider]="option.tone === 'provider'"
      (click)="onModeSelect(option.value)"
    >
      <img
        *ngIf="option.imageUrl; else modeIcon"
        [src]="option.imageUrl"
        alt=""
        aria-hidden="true"
      />
      <ng-template #modeIcon>
        <lucide-icon
          *ngIf="option.icon"
          [name]="option.icon"
          size="14"
          [strokeWidth]="2.4"
        ></lucide-icon>
      </ng-template>
      {{ option.label }}
    </button>
  </div>

  <div *ngIf="isServiceVariant && showLocationMenu" class="app-search-bar__location-menu">
    <section class="app-search-bar__filter-group">
      <p>TRIER PAR</p>
      <div class="app-search-bar__sort-options">
        <button
          type="button"
          [class.app-search-bar__filter-option--active]="locationSort === 'RATING'"
          (click)="selectLocationSort('RATING')"
        >
          <lucide-icon name="star" size="15" [strokeWidth]="2.2"></lucide-icon>
          Meilleures notes
        </button>
        <button
          type="button"
          [class.app-search-bar__filter-option--active]="locationSort === 'DISTANCE'"
          (click)="selectLocationSort('DISTANCE')"
        >
          <lucide-icon name="map-pin" size="15" [strokeWidth]="2.2"></lucide-icon>
          Plus proches
        </button>
      </div>
    </section>

    <section class="app-search-bar__filter-group">
      <p>RECHERCHER PAR</p>
      <label
        class="app-search-bar__location-choice"
        [class.app-search-bar__location-choice--active]="locationSource === 'WRITTEN'"
      >
        <input
          type="radio"
          name="location-source"
          value="WRITTEN"
          [checked]="locationSource === 'WRITTEN'"
          (change)="selectLocationSource('WRITTEN')"
        />
        <span class="app-search-bar__radio"></span>
        <span class="app-search-bar__location-choice-copy">
          <strong>Position &eacute;crite</strong>
          <small>Quartier, ville ou adresse</small>
          <span class="app-search-bar__written-location">
            <lucide-icon name="map-pin" size="14" [strokeWidth]="2.2"></lucide-icon>
            <input
              type="text"
              [value]="writtenLocation"
              placeholder="Ex: Plateau, Dakar..."
              (input)="onWrittenLocationInput($event)"
            />
          </span>
        </span>
      </label>

      <label
        class="app-search-bar__location-choice"
        [class.app-search-bar__location-choice--active]="locationSource === 'GPS'"
      >
        <input
          type="radio"
          name="location-source"
          value="GPS"
          [checked]="locationSource === 'GPS'"
          (change)="selectLocationSource('GPS')"
        />
        <span class="app-search-bar__radio"></span>
        <span class="app-search-bar__location-choice-copy">
          <strong>Ma localisation GPS</strong>
          <small>Utiliser ma position actuelle</small>
        </span>
      </label>
    </section>

    <button type="button" class="app-search-bar__apply-location" (click)="applyLocationFilter()">
      Appliquer les filtres
    </button>
  </div>

  <div *ngIf="isServiceVariant && showSuggestions" class="app-search-bar__suggestions">
    <section
      *ngIf="textSuggestions.length > 0"
      class="app-search-bar__suggestion-section app-search-bar__suggestion-section--terms"
      aria-label="Suggestions de recherche"
    >
      <div class="app-search-bar__text-suggestions">
        <button
          *ngFor="let suggestion of textSuggestions"
          type="button"
          class="app-search-bar__text-suggestion"
          (click)="onTextSuggestionSelect(suggestion.value)"
        >
          <span>{{ suggestionPart(suggestion.value, 'before') }}</span><strong>{{
            suggestionPart(suggestion.value, 'match')
          }}</strong><span>{{ suggestionPart(suggestion.value, 'after') }}</span>
        </button>
      </div>
    </section>

    <section *ngIf="categorySuggestions.length > 0" class="app-search-bar__suggestion-section">
      <div class="app-search-bar__suggestion-heading">
        <span>
          <lucide-icon name="layout-dashboard" size="13" [strokeWidth]="2"></lucide-icon>
          Cat&eacute;gories
        </span>
        <button *ngIf="hasHiddenCategories" type="button" (click)="toggleCategoryList()">
          {{ showAllCategories ? 'Voir moins' : 'Tout voir' }}
        </button>
      </div>
      <div
        class="app-search-bar__category-list"
        [class.app-search-bar__category-list--expanded]="showAllCategories"
      >
        <button
          *ngFor="let category of visibleCategorySuggestions"
          type="button"
          class="app-search-bar__category-chip"
          [class.app-search-bar__category-chip--emphasized]="category.emphasized"
          (click)="categorySelect.emit(category.id)"
        >
          <lucide-icon
            [name]="category.icon || 'wrench'"
            size="14"
            [strokeWidth]="2.1"
          ></lucide-icon>
          {{ category.name }}
          <small>{{ category.count }}</small>
        </button>
      </div>
    </section>

    <section *ngIf="providerSuggestions.length > 0" class="app-search-bar__suggestion-section">
      <div class="app-search-bar__suggestion-heading">
        <span>
          <i aria-hidden="true"></i>
          Prestataires
        </span>
        <button type="button" (click)="suggestionsClose.emit()">Voir tout</button>
      </div>
      <button
        *ngFor="let provider of providerSuggestions"
        type="button"
        class="app-search-bar__provider"
        (click)="providerSelect.emit(provider.id)"
      >
        <span class="app-search-bar__avatar">
          <img
            *ngIf="provider.avatarUrl; else providerInitials"
            [src]="provider.avatarUrl"
            [alt]="provider.name"
          />
          <ng-template #providerInitials>{{ provider.initials }}</ng-template>
          <app-presence-dot
            [userId]="provider.userId"
            [professionalId]="provider.id"
            [initialOnline]="provider.isOnline"
          />
        </span>
        <span class="app-search-bar__provider-info">
          <strong>
            {{ provider.name }}
            <small>
              <span>{{ suggestionPart(provider.speciality, 'before') }}</span><b>{{
                suggestionPart(provider.speciality, 'match')
              }}</b><span>{{ suggestionPart(provider.speciality, 'after') }}</span>
            </small>
          </strong>
          <span>{{ provider.location }}</span>
        </span>
        <span class="app-search-bar__provider-action">
          Voir
          <lucide-icon name="arrow-right" size="14" [strokeWidth]="2.4"></lucide-icon>
        </span>
      </button>
    </section>

    <p
      *ngIf="
        textSuggestions.length === 0 &&
        categorySuggestions.length === 0 &&
        providerSuggestions.length === 0
      "
      class="app-search-bar__empty"
    >
      Aucune suggestion trouv&eacute;e pour &laquo;&nbsp;{{ value }}&nbsp;&raquo;.
    </p>

    <footer class="app-search-bar__suggestion-footer">
      <span>{{ resultsNearLabel || 'Resultats pres de ' + locationValue }}</span>
      <strong>Jokko Dimbali</strong>
    </footer>
  </div>
</form>
