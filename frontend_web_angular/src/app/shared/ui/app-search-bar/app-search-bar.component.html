<form
  class="app-search-bar"
  [class.app-search-bar--compact]="variant === 'compact'"
  [attr.aria-label]="ariaLabel"
  (submit)="$event.preventDefault(); onSubmit()"
>
  <button type="button" class="app-search-bar__location">
    <lucide-icon name="map-pin" size="22" [strokeWidth]="3"></lucide-icon>
    <span><strong>{{ locationTitle }}</strong>{{ locationValue }}</span>
  </button>

  <label class="app-search-bar__field">
    <lucide-icon name="search" size="35" [strokeWidth]="2.6"></lucide-icon>
    <input
      type="search"
      [value]="value"
      [placeholder]="placeholder"
      (input)="onInputEvent($event)"
    />
  </label>

  <button type="button" class="app-search-bar__filter" aria-label="Ouvrir les filtres" (click)="onFilterClick()">
    <lucide-icon name="sliders-horizontal" size="30" [strokeWidth]="3"></lucide-icon>
    <span>
      <strong>{{ filterLabel }}</strong>
      <small *ngIf="filterValueLabel">{{ filterValueLabel }}</small>
    </span>
  </button>
</form>
